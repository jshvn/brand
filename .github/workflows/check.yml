# Every pull request, and every push to main: rebuild in the toolbox image and prove the
# committed files, the palette's contrast, fonts/ and the docs all still agree.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: go-task/setup-task@v2.2.0

      # Apple `container` is a laptop thing; a runner has Docker.
      - run: task check
        env:
          ENGINE: docker
