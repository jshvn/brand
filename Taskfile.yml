# The brand kit for ijosh.com: every file in mark/, social/, share/, photo/, fonts/ and tokens.css,
# generated in the toolbox image (fonts/ excepted) and committed. Cloudflare Pages serves it at brand.ijosh.com.
version: '3'

vars:
  IMAGE: jshvn-brand
  ORIGIN: '{{.ORIGIN | default "https://brand.ijosh.com"}}'
  ENGINE:
    sh: |
      if [ -n "$ENGINE" ]; then echo "$ENGINE"
      elif command -v container >/dev/null 2>&1 && container system status >/dev/null 2>&1; then echo container
      elif command -v docker >/dev/null 2>&1; then echo docker
      elif command -v container >/dev/null 2>&1; then echo container
      else echo docker
      fi

tasks:
  default:
    desc: Print the menu
    silent: true
    # ponytail: hand-maintained menu, since go-task can neither group nor annotate
    cmds:
      - |
        b=$(printf '\033[1m'); c=$(printf '\033[1;36m'); d=$(printf '\033[2m'); r=$(printf '\033[0m')
        printf '%s\n' \
          "" \
          "${b}brand${r}   ${d}the ijosh.com mark and every file other repos consume${r}" \
          "" \
          "${c}checks -- offline, changes nothing${r}" \
          "  task check                Rebuild into a temp dir and diff against the committed tree" \
          "                            ${d}a diff means a source changed and was not rebuilt${r}" \
          "  task check:docs           Every file and heading the docs name is there" \
          "                            ${d}runs inside task check too${r}" \
          "" \
          "${c}checks -- reaches the live origin${r}" \
          "  task check:urls           Every file in mark/, social/, share/, photo/ and fonts/ is served at {{.ORIGIN}}" \
          "                            ${d}status, content type, cache policy, robots, and a 404 for a missing path; ORIGIN= to point elsewhere${r}" \
          "" \
          "${c}build -- rewrites mark/, social/, share/ and photo/${r}" \
          "  task build                Regenerate mark/, social/ and share/, and photo/ from its master" \
          "                            ${d}commit the result; consumers never run this${r}" \
          "" \
          "${c}site -- what Pages serves at brand.ijosh.com${r}" \
          "  task site                 Stage the site into public/ (what the Pages build runs)" \
          "  task site:serve           Stage, then serve public/ on http://localhost:8080" \
          "" \
          "${c}images -- the toolbox${r}" \
          "  task image                Build the toolbox image ({{.IMAGE}}, {{.ENGINE}})" \
          "  task run -- <cmd>         Run any command inside it with the repo mounted" \
          "  task clean                Remove the image and any build scratch" \
          ""

  check:
    desc: Rebuild into a temp dir, diff it against the committed tree, and check the docs
    deps: [image]
    cmds:
      - rm -rf .build && mkdir -p .build
      - defer: rm -rf .build
      - task: run
        vars: { CLI_ARGS: node src/build.mjs .build }
      - diff -rq .build/mark mark
      - diff -rq .build/social social
      - diff -rq .build/share share
      - diff -rq .build/photo photo
      - diff .build/tokens.css tokens.css
      - task: check:docs

  check:docs:
    desc: Fail if README.md or the index page names a file or heading that is not there
    deps: [image]
    cmds:
      - task: run
        vars: { CLI_ARGS: node src/check-docs.mjs }

  check:urls:
    desc: Assert every served file is at ORIGIN with the right headers, and a missing path is a 404
    silent: true
    env:
      ORIGIN: '{{.ORIGIN}}'
    cmds:
      # One request per file, headers only. Robots is asserted both ways so a
      # copy-paste in _headers is caught.
      - |
        fail=0
        probe() { # path  expected-type-regex  cache(yes|no)  robots(noindex|none|any)
          h=$(curl -sS -o /dev/null -D - --max-time 20 "$ORIGIN$1" 2>/dev/null | tr -d '\r') \
            || { echo "FAIL $1: no response"; fail=1; return; }
          status=$(printf '%s\n' "$h" | awk 'NR==1{print $2}')
          ctype=$(printf '%s\n' "$h" | awk -F': ' 'tolower($1)=="content-type"{print $2}')
          cc=$(printf '%s\n' "$h" | awk -F': ' 'tolower($1)=="cache-control"{print $2}')
          xr=$(printf '%s\n' "$h" | awk -F': ' 'tolower($1)=="x-robots-tag"{print $2}')
          [ "$status" = 200 ] || { echo "FAIL $1: status $status"; fail=1; return; }
          printf '%s' "$ctype" | grep -Eq "$2" || { echo "FAIL $1: content-type '$ctype'"; fail=1; return; }
          if [ "$3" = yes ]; then
            printf '%s' "$cc" | grep -q 'max-age=300' || { echo "FAIL $1: cache-control '$cc'"; fail=1; return; }
          fi
          case "$4" in
            noindex) printf '%s' "$xr" | grep -q noindex || { echo "FAIL $1: expected X-Robots-Tag noindex, got '$xr'"; fail=1; return; } ;;
            none)    [ -z "$xr" ] || { echo "FAIL $1: unexpected X-Robots-Tag '$xr'"; fail=1; return; } ;;
          esac
          echo "ok   $1"
        }
        type_for() {
          case "$1" in
            *.svg) echo 'image/svg\+xml' ;;   *.png) echo 'image/png' ;;
            *.css) echo 'text/css' ;;
            *.jpg) echo 'image/jpeg' ;;       *.pdf) echo 'application/pdf' ;;
            *.ico) echo 'image/(vnd\.microsoft\.icon|x-icon)' ;;
            *.woff2) echo 'font/woff2' ;;     *.txt) echo 'text/plain' ;;
            *) echo '.' ;;
          esac
        }
        probe /            'text/html'  no  noindex
        probe /robots.txt  'text/plain' no  any
        probe /tokens.css  'text/css'   yes none
        for f in $(find mark -type f | sort); do probe "/$f" "$(type_for "$f")" yes none; done
        for f in $(find social -type f | sort); do probe "/$f" "$(type_for "$f")" yes noindex; done
        for f in $(find share -type f | sort); do probe "/$f" "$(type_for "$f")" yes none; done
        for f in $(find photo -type f | sort); do probe "/$f" "$(type_for "$f")" yes noindex; done
        for f in $(find fonts -type f | sort); do probe "/$f" "$(type_for "$f")" yes none; done
        # Without site/404.html Pages answers a missing path with the index and a 200.
        miss=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$ORIGIN/no-such-file" 2>/dev/null)
        if [ "$miss" = 404 ]; then echo "ok   /no-such-file is a 404"
        else echo "FAIL /no-such-file: status $miss, expected 404"; fail=1; fi
        [ "$fail" -eq 0 ] && echo "check:urls: every file served at $ORIGIN"
        exit "$fail"

  build:
    desc: Regenerate every file in mark/, social/, share/ and photo/, and tokens.css
    deps: [image]
    cmds:
      - task: run
        vars: { CLI_ARGS: node src/build.mjs }

  site:
    desc: Stage the site into public/, exactly as the Pages build does
    cmds:
      - sh site/stage.sh

  site:serve:
    desc: Stage, then serve public/ locally
    deps: [site]
    cmds:
      - python3 -m http.server -d public 8080

  image:
    desc: Build the toolbox image
    run: once
    # Image presence is the freshness check; a Dockerfile edit needs `task clean` first.
    status:
      - '{{.ENGINE}} image inspect {{.IMAGE}} >/dev/null 2>&1'
    cmds:
      - '{{.ENGINE}} build -t {{.IMAGE}} docker/'

  run:
    desc: 'Run any command in the toolbox image, e.g. task run -- node src/build.mjs'
    cmds:
      - >-
        {{.ENGINE}} run --rm -i $(test -t 0 && test -t 1 && echo -t || true)
        --user $(id -u):$(id -g)
        -v "{{.ROOT_DIR}}":/work -w /work
        -e HOME=/tmp
        {{.IMAGE}} {{.CLI_ARGS}}

  clean:
    desc: Remove the toolbox image, the staged site and build scratch
    cmds:
      - rm -rf .build public
      - '{{.ENGINE}} image rm {{.IMAGE}} >/dev/null 2>&1 || true'
